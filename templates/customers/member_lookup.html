<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shooties — Member Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #fafaf8; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px 16px;
    }
    .brand { text-align: center; margin-bottom: 32px; }
    .brand-logo {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #ff8c00, #ff6000);
      border-radius: 18px; display: flex; align-items: center; justify-content: center;
      font-size: 28px; margin: 0 auto 12px; box-shadow: 0 4px 16px rgba(255, 140, 0, 0.25);
    }
    .brand-name { font-size: 26px; font-weight: 800; color: #1a1a1a; letter-spacing: -0.5px; }
    .brand-tagline { font-size: 14px; color: #888; margin-top: 4px; }
    .card {
      background: #fff; border-radius: 20px;
      box-shadow: 0 2px 24px rgba(0,0,0,0.07), 0 1px 4px rgba(0,0,0,0.04);
      width: 100%; max-width: 420px; padding: 36px 32px;
    }
    .card-title { font-size: 22px; font-weight: 700; color: #1a1a1a; margin-bottom: 6px; }
    .card-subtitle { font-size: 14px; color: #777; margin-bottom: 28px; line-height: 1.5; }
    label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 7px; letter-spacing: 0.2px; }
    input[type="tel"] {
      width: 100%; padding: 12px 14px; border: 1.5px solid #e8e8e8; border-radius: 10px;
      font-size: 15px; color: #1a1a1a; background: #fafafa;
      transition: border-color 0.2s, box-shadow 0.2s; outline: none;
    }
    input[type="tel"]:focus { border-color: #ff8c00; background: #fff; box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.12); }
    .field-error { font-size: 13px; color: #e03e3e; margin-top: 5px; }
    .field-hint { font-size: 12px; color: #aaa; margin-top: 5px; }
    .btn-submit {
      width: 100%; padding: 13px; background: linear-gradient(135deg, #ff8c00, #ff6000);
      color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: opacity 0.2s, transform 0.1s; margin-top: 18px; letter-spacing: 0.2px;
    }
    .btn-submit:hover { opacity: 0.92; }
    .btn-submit:active { transform: scale(0.99); }
    .register-cta { text-align: center; margin-top: 18px; padding-top: 18px; border-top: 1px solid #f0f0f0; font-size: 13px; color: #888; }
    .register-cta a { color: #ff6000; font-weight: 700; text-decoration: none; }
    .footer-note { text-align: center; font-size: 12px; color: #bbb; margin-top: 24px; }
    @media (max-width: 480px) { .card { padding: 28px 20px; } }
  </style>
</head>
<body>

  <div class="brand">
    <div class="brand-logo">🥤</div>
    <div class="brand-name">Shooties</div>
    <div class="brand-tagline">Fresh blends, every day</div>
  </div>

  <div class="card">
    <div class="card-title">Welcome back</div>
    <div class="card-subtitle">Enter your phone number to view your member profile and Shooties Passport.</div>

    <form method="post" novalidate>
      {% csrf_token %}
      <label for="id_phone">Phone Number</label>
      <input type="tel" name="phone" id="id_phone" placeholder="e.g. 08123456789"
             value="{{ phone_value|default:'' }}" autocomplete="tel"
             inputmode="numeric" pattern="[0-9+\-\s]*" autofocus>
      <div class="field-hint">Digits only.</div>
      {% if error %}
        <div class="field-error">{{ error }}</div>
      {% endif %}

      <button type="submit" class="btn-submit">View my profile →</button>
    </form>

    <div class="register-cta">
      New here? <a href="{% url 'customer_register' %}">Become a member →</a>
    </div>
  </div>

  <div class="footer-note">Sip happens. 🍊</div>

  <script>
    (function () {
      var phone = document.getElementById('id_phone');
      if (!phone) return;
      phone.addEventListener('input', function () {
        var cleaned = this.value.replace(/[^0-9+\-\s]/g, '');
        if (cleaned !== this.value) this.value = cleaned;
      });
    })();
  </script>

</body>
</html>
